redis:
  enabled: true

  image:
    repository: m.daocloud.io/docker.io/library/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 6379

  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  enabled: true

  image:
    repository: m.daocloud.io/docker.io/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 5432

  auth:
    database: stark_monitor
    username: stark
    existingSecret: postgres-secret
    passwordKey: password

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

kafka:
  enabled: true

  image:
    repository: m.daocloud.io/docker.io/apache/kafka
    tag: "4.3.1"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    brokerPort: 9092
    controllerPort: 9093

  kraft:
    nodeId: "1"
    processRoles: "broker,controller"
    listeners: "PLAINTEXT://:9092,CONTROLLER://:9093"
    advertisedListeners: "PLAINTEXT://kafka:9092"
    controllerListenerNames: "CONTROLLER"
    listenerSecurityProtocolMap: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    controllerQuorumVoters: "1@kafka:9093"

  clusterId: "4L6g3nShT-eMCtK--X86sw"

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

  topic:
    name: stark.metrics.raw
    partitions: 6
    replicationFactor: 1

backend:
  enabled: true

  image:
    repository: ghcr.io/king1039/zf-monitor-back
    tag: "latest"
    pullPolicy: Always

  replicas: 1

  containerPort: 8080
  hostPort: 18080

  service:
    type: NodePort
    port: 8080
    nodePort: 30080

  database:
    existingSecret: backend-secret
    urlKey: database-url

  redis:
    addr: redis:6379

  kafka:
    addr: kafka:9092
    topic: stark.metrics.raw
    consumerGroup: stark-monitor-metrics-v1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

dbController:
  enabled: true

  image:
    repository: ghcr.io/king1039/zf-monitor-db-controller
    tag: "latest"
    pullPolicy: Always

  replicas: 1

  config:
    existingSecret: db-controller-config
    secretKey: config.yaml

  hostPath:
    enabled: true
    path: /opt/zf-monitor-docker-data/backend
    mountPath: /app/data

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  