{{- if .Values.kafka.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app: kafka

  ports:
    - name: broker
      port: {{ .Values.kafka.service.brokerPort }}
      targetPort: {{ .Values.kafka.service.brokerPort }}

    - name: controller
      port: {{ .Values.kafka.service.controllerPort }}
      targetPort: {{ .Values.kafka.service.controllerPort }}

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: kafka
  replicas: {{ .Values.kafka.replicas }}

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}

          ports:
            - name: broker
              containerPort: {{ .Values.kafka.service.brokerPort }}

            - name: controller
              containerPort: {{ .Values.kafka.service.controllerPort }}

          env:
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.kraft.nodeId | quote }}

            - name: KAFKA_PROCESS_ROLES
              value: {{ .Values.kafka.kraft.processRoles | quote }}

            - name: KAFKA_LISTENERS
              value: {{ .Values.kafka.kraft.listeners | quote }}

            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ .Values.kafka.kraft.advertisedListeners | quote }}

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: {{ .Values.kafka.kraft.controllerListenerNames | quote }}

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kafka.kraft.listenerSecurityProtocolMap | quote }}

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ .Values.kafka.kraft.controllerQuorumVoters | quote }}

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.kafka.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}

---

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}

  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 6

  template:
    metadata:
      labels:
        app: kafka-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: kafka-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}

          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka..."

              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:{{ .Values.kafka.service.brokerPort }} \
                --list >/dev/null 2>&1
              do
                echo "Kafka is not ready yet..."
                sleep 5
              done

              echo "Kafka is ready."

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:{{ .Values.kafka.service.brokerPort }} \
                --create \
                --if-not-exists \
                --topic {{ .Values.kafka.topic.name }} \
                --partitions {{ .Values.kafka.topic.partitions }} \
                --replication-factor {{ .Values.kafka.topic.replicationFactor }}

              echo "Kafka topic initialized."

{{- end }}