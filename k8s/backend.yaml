apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stark-monitor
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stark-monitor
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/king1039/zf-monitor-back:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: REDIS_ADDR
              value: "redis:6379"

            - name: KAFKA_ADDR
              value: "kafka:9092"

            - name: KAFKA_TOPIC
              value: "stark.metrics.raw"

            - name: KAFKA_CONSUMER_GROUP
              value: "stark-monitor-metrics-v1"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"